<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InterviewKit — Walk In Ready: Network Engineer Interview Prep</title>
<meta name="description" content="InterviewKit prepares you for a network engineer interview: 60 real CCNA, FortiGate and troubleshooting questions with model answers, flashcards, a timed mock interview, a subnet lab and a STAR answer builder.">
<meta name="theme-color" content="#f7f1e5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f1e5; --paper2:#efe6d2; --card:#fffdf7; --ink:#2b1d12; --ink2:#6b5744;
  --amber:#d9a441; --gold:#b98a2e; --terra:#c96f3f; --bronze:#a67c52;
  --dark:#241a10; --dark2:#33241290; --panel:#2e2013; --panel2:#3a2a18;
  --cream:#f7efe3; --muted:#c9b8a3; --line:rgba(43,29,18,.14); --line-l:rgba(247,239,227,.16);
  --good:#5d8a4a; --warn:#d9a441; --bad:#c25a3d;
  --shadow:0 16px 44px rgba(43,29,18,.14);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.12;letter-spacing:-.01em}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--terra)}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
.kicker{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--terra)}
.helper{font-size:13px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14px;background:var(--ink);color:var(--paper);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(43,29,18,.25)}
.btn.amber{background:var(--amber);color:#241505}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost-l{background:transparent;color:var(--cream);border:1px solid var(--line-l)}
.btn.small{padding:8px 14px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(194,90,61,.5)}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(43,29,18,.06);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600}
.chip.l{background:rgba(247,239,227,.08);border-color:var(--line-l);color:var(--cream)}
section{padding:46px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(26px,4vw,36px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:800;letter-spacing:.04em}
.pill.good{background:rgba(93,138,74,.14);color:var(--good)}
.pill.warn{background:rgba(217,164,65,.16);color:#8a6420}
.pill.bad{background:rgba(194,90,61,.13);color:var(--bad)}
.pill.info{background:rgba(169,124,82,.16);color:#7a5a34}
/* ---- intro ---- */
#intro{position:fixed;inset:0;z-index:200;background:var(--dark);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;transition:opacity .6s}
#intro.hide{opacity:0;pointer-events:none}
#intro .mark{width:74px;height:74px;border-radius:22px;background:linear-gradient(135deg,var(--amber),var(--terra));display:grid;place-items:center;margin-bottom:22px;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
#intro .mark svg{width:38px;height:38px}
#intro h1{font-size:clamp(34px,7vw,56px);opacity:0;animation:rise .7s .25s ease both}
#intro h1 em{color:var(--amber);font-style:normal}
#intro p{color:var(--muted);margin-top:12px;font-size:16px;opacity:0;animation:rise .7s .5s ease both}
#intro .bar{width:210px;height:4px;border-radius:99px;background:rgba(247,239,227,.16);margin-top:30px;overflow:hidden}
#intro .bar i{display:block;height:100%;width:0;background:var(--amber);border-radius:99px;animation:load 3.6s .3s ease forwards}
#intro .skip{margin-top:22px;font-size:13px;color:var(--muted);opacity:0;animation:rise .7s .8s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes load{to{width:100%}}
/* ---- coach ---- */
#coach{position:fixed;inset:0;z-index:190;background:rgba(36,26,16,.55);display:none;align-items:flex-end;justify-content:center;padding:18px}
#coach.show{display:flex}
#coach .sheet{background:var(--card);border-radius:22px;max-width:480px;width:100%;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
#coach .sheet h3{font-size:24px;margin:6px 0 8px}
#coach .dots{display:flex;gap:6px;margin:16px 0}
#coach .dots i{width:26px;height:5px;border-radius:99px;background:rgba(43,29,18,.15)}
#coach .dots i.on{background:var(--terra)}
/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(247,241,229,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1060px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-size:22px;font-weight:700;color:var(--ink);text-decoration:none}
.logo .mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--amber),var(--terra));display:grid;place-items:center;color:#fff8ec}
.logo .mark svg{width:20px;height:20px}
.topbar .spacer{flex:1}
.topbar .chip b{color:var(--terra)}
/* ---- hero ---- */
.hero{position:relative;padding:0 0 8px}
.hero-photo{position:relative;height:min(70vh,540px);overflow:hidden}
.hero-photo img{width:100%;height:100%;object-fit:cover;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateX(0)}to{transform:scale(1.08) translateX(-1.2%)}}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,29,18,.18) 0%,rgba(43,29,18,.02) 42%,var(--paper) 97%)}
.hero-copy{position:relative;margin-top:-168px;z-index:2}
.hero-copy .kicker{color:var(--terra)}
.hero-copy h1{font-size:clamp(38px,7vw,62px);max-width:640px}
.hero-copy h1 em{color:var(--terra);font-style:normal}
.hero-copy p{font-size:17px;color:var(--ink2);max-width:560px;margin-top:10px}
.interview-card{margin-top:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:22px 24px}
.interview-card .role{font-family:Fraunces,serif;font-size:26px;font-weight:700}
.interview-card .co{color:var(--ink2);font-size:14px;margin-top:2px}
.countdown{display:flex;gap:10px}
.countdown .cd{background:var(--paper2);border:1px solid var(--line);border-radius:14px;min-width:64px;padding:10px 8px;text-align:center}
.countdown .cd b{display:block;font-family:Fraunces,serif;font-size:26px;line-height:1}
.countdown .cd span{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
/* ---- readiness dashboard ---- */
.dash{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:stretch}
.ring-card{padding:24px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-wrap{position:relative;width:190px;height:190px;margin:6px auto 4px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-wrap .ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-wrap .ring-num b{font-family:Fraunces,serif;font-size:46px;line-height:1}
.ring-wrap .ring-num span{font-size:12px;color:var(--ink2);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:Fraunces,serif;font-size:30px;line-height:1.05}
.stat span{font-size:12.5px;color:var(--ink2);font-weight:600}
.topic-bars{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.tbar-row{display:grid;grid-template-columns:190px 1fr 52px;gap:12px;align-items:center;font-size:13.5px}
.tbar-row .nm{font-weight:700}
.tbar{height:9px;border-radius:99px;background:rgba(43,29,18,.1);overflow:hidden}
.tbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--amber),var(--terra));transition:width .5s ease}
.tbar-row .pc{font-weight:800;text-align:right;color:var(--terra)}
/* ---- topic rail ---- */
.rail{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.topic-card{flex:0 0 250px;scroll-snap-align:start;padding:20px;cursor:pointer;transition:transform .18s,box-shadow .18s}
.topic-card:hover{transform:translateY(-3px)}
.topic-card.sel{outline:2px solid var(--terra);outline-offset:2px}
.topic-card .ic{width:44px;height:44px;border-radius:14px;background:var(--paper2);display:grid;place-items:center;color:var(--terra);margin-bottom:12px}
.topic-card .ic svg{width:24px;height:24px}
.topic-card h3{font-size:20px}
.topic-card p{font-size:13.5px;color:var(--ink2);margin-top:5px;min-height:40px}
.topic-card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12.5px;font-weight:700}
.topic-card .mini{height:7px;border-radius:99px;background:rgba(43,29,18,.1);overflow:hidden;margin-top:8px}
.topic-card .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--terra))}
